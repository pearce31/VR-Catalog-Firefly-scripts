<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#4ff0c8;font:600 18px/1.5 ui-monospace,system-ui,sans-serif;text-align:center;
    padding:24px;white-space:pre-wrap;background:rgba(0,0,0,.6);pointer-events:none}
</style>
</head>
<body>
<video id="v" playsinline controls autoplay crossorigin="anonymous"></video>
<div id="msg">Requesting transcode…</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function(){
  "use strict";
  const q = new URLSearchParams(location.search);
  const BASE = q.get("b"), TOKEN = q.get("t"), KEY = q.get("k");
  const v = document.getElementById("v"), msg = document.getElementById("msg");
  const show = t => { msg.textContent = t; msg.style.display = "flex"; };
  const hide = () => { msg.style.display = "none"; };
  if(!BASE || !TOKEN || !KEY){
    // Generic mode: play any HLS/MP4 URL directly (Emby/Jellyfin). ?src=<url>&hls=1
    const SRC = q.get("src");
    if(SRC){
      const isHls = q.get("hls")==="1" || /\.m3u8(\?|$)/i.test(SRC);
      v.addEventListener("playing", hide);
      v.addEventListener("timeupdate", ()=>{ if(v.currentTime>0) hide(); });
      const playSrc = ()=>{
        if(isHls){
          if(window.Hls && Hls.isSupported()){
            const hls = new Hls();
            hls.on(Hls.Events.ERROR,(e,d)=>{ if(d&&d.fatal) show("HLS "+d.type+" / "+(d.details||"")); });
            hls.on(Hls.Events.MANIFEST_PARSED,()=>{ hide(); v.play().catch(()=>show("Tap / click to play")); });
            hls.loadSource(SRC); hls.attachMedia(v);
          } else if(v.canPlayType("application/vnd.apple.mpegurl")){
            v.src=SRC; hide(); v.play().catch(()=>show("Tap / click to play"));
          } else show("HLS not supported here");
        } else {
          v.src=SRC; hide(); v.play().catch(()=>show("Tap / click to play"));
        }
      };
      if(isHls && !window.Hls){
        let w=0; const iv=setInterval(()=>{ if(window.Hls){clearInterval(iv);playSrc();} else if((w+=200)>6000){clearInterval(iv);show("hls.js failed to load");} },200);
      } else playSrc();
      return;
    }
    show("Missing params (b/t/k or src)"); return;
  }

  // Match Plex Web's real request. hasMDE=1 -> must call /decision first.
  // directStreamAudio=0 -> transcode AC3/DTS to AAC (sound). HLS so hls.js can play it.
  const CID = "firefly-" + Math.random().toString(36).slice(2);
  const SID = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  const common = {
    hasMDE: "1", path: KEY, mediaIndex: "0", partIndex: "0",
    protocol: "hls", fastSeek: "1", directPlay: "0", directStream: "1",
    subtitleSize: "100", audioBoost: "100", location: "lan",
    addDebugOverlay: "0", autoAdjustQuality: "0", directStreamAudio: "0",
    mediaBufferSize: "102400", session: SID, subtitles: "none",
    "Accept-Language": "en",
    "X-Plex-Session-Identifier": SID,
    "X-Plex-Client-Profile-Extra":
      "append-transcode-target-codec(type=videoProfile&context=streaming&videoCodec=h264&audioCodec=aac&protocol=hls)",
    "X-Plex-Incomplete-Segments": "1",
    "X-Plex-Product": "Plex Web", "X-Plex-Version": "4.160.0",
    "X-Plex-Client-Identifier": CID,
    "X-Plex-Platform": "Chrome", "X-Plex-Platform-Version": "137.0",
    "X-Plex-Features": "external-media,indirect-media",
    "X-Plex-Model": "standalone", "X-Plex-Device": "Windows", "X-Plex-Device-Name": "Firefly",
    "X-Plex-Token": TOKEN
  };
  const qs = o => Object.keys(o).map(k => encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");
  const MP = q.get("mp");   // optional media-proxy origin, e.g. http://127.0.0.1:8877
  function pathMount(fullUrl){
    if(!MP) return fullUrl;
    try{ const u=new URL(fullUrl);
      const b64=btoa(unescape(encodeURIComponent(u.origin))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
      return MP.replace(/\/+$/,"") + "/s/" + b64 + u.pathname + u.search;
    }catch(_){ return fullUrl; }
  }
  let decisionUrl, startUrl;
  function buildUrls(){
    decisionUrl = BASE + "/video/:/transcode/universal/decision?" + qs(common);
    startUrl    = pathMount(BASE + "/video/:/transcode/universal/start.m3u8?" + qs(common));
  }
  buildUrls();
  // Pick the English audio track (Plex otherwise defaults to track 0)
  async function pickEnglishAudio(){
    try{
      const mr = await fetch(BASE + KEY + (KEY.indexOf("?")<0?"?":"&") + "X-Plex-Token=" + encodeURIComponent(TOKEN), { headers:{ Accept:"application/json" } });
      if(!mr.ok) return;
      const mj = await mr.json();
      const md = mj.MediaContainer && mj.MediaContainer.Metadata && mj.MediaContainer.Metadata[0];
      const part = md && md.Media && md.Media[0] && md.Media[0].Part && md.Media[0].Part[0];
      const streams = (part && part.Stream) || [];
      const auds = streams.filter(x => x.streamType===2);
      const eng = auds.find(x => /^(eng|en)\b/i.test(((x.languageCode||x.language||"")+"")))
               || auds.find(x => /english/i.test(((x.language||"")+"")));
      if(eng && eng.id){
        common.audioStreamID = String(eng.id);
        buildUrls();
        // Also select it on the part server-side (Plex honors this over the param)
        if(part && part.id){
          try{ await fetch(BASE + "/library/parts/" + part.id + "?audioStreamID=" + encodeURIComponent(eng.id)
              + "&X-Plex-Token=" + encodeURIComponent(TOKEN), { method:"PUT" }); }catch(_){}
        }
      }
    }catch(_){}
  }
  const withTok = u => u.indexOf("X-Plex-Token=") >= 0 ? u
      : u + (u.indexOf("?") < 0 ? "?" : "&") + "X-Plex-Token=" + encodeURIComponent(TOKEN);

  v.addEventListener("playing", hide);
  document.addEventListener("click", ()=>{ v.muted=false; v.play().catch(()=>{}); });

  async function safeText(r){ try{ return (await r.text()).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,200); }catch(_){ return ""; } }

  function play(){
    if(window.Hls && Hls.isSupported()){
      const hls = new Hls({
        xhrSetup:(xhr,url)=>{ xhr.open("GET", withTok(url), true); },
        fragLoadingTimeOut: 60000,
        fragLoadingMaxRetry: 8,
        fragLoadingRetryDelay: 1000,
        manifestLoadingTimeOut: 30000,
        levelLoadingTimeOut: 30000,
        maxBufferLength: 60,              // deep cushion for high-bitrate stream-copy
        maxMaxBufferLength: 600,
        maxBufferSize: 200*1000*1000,    // 200MB so high-bitrate video buffers far ahead
        backBufferLength: 30,
        maxBufferHole: 1,
        highBufferWatchdogPeriod: 3,
        nudgeMaxRetry: 20,               // keep nudging past stalls instead of dying
        lowLatencyMode: false
      });
      // auto-recover: if playback stalls waiting on the transcoder, nudge it along
      let stallT=null;
      v.addEventListener("waiting", ()=>{ clearTimeout(stallT);
        stallT=setTimeout(()=>{ if(v.readyState<3 && !v.paused){ try{ v.currentTime += 0.1; }catch(_){} v.play().catch(()=>{}); } }, 4000); });
      v.addEventListener("playing", ()=>{ clearTimeout(stallT); hide(); });
      let sawManifest=false, sawFrag=false;
      hls.on(Hls.Events.MANIFEST_LOADING, ()=>show("Loading manifest…"));
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ sawManifest=true; show("Manifest OK — starting…"); v.play().catch(()=>show("Tap / click to play")); });
      hls.on(Hls.Events.FRAG_LOADED, ()=>{ if(!sawFrag){ sawFrag=true; hide(); } });
      hls.on(Hls.Events.ERROR, (e,d)=>{
        const code = d && d.response ? (" HTTP "+(d.response.code||"?")) : "";
        if(d && d.fatal){ show("HLS " + d.type + " / " + (d.details||"") + code); }
        // non-fatal (bufferFull, nudge, etc.) are normal — ignore them
      });
      setTimeout(()=>{ if(!sawManifest) show("Stuck: no manifest (transcode not starting on Plex)"); }, 15000);
      setTimeout(()=>{ if(sawManifest && !sawFrag) show("Stuck: manifest OK but no video segments"); }, 20000);
      hls.loadSource(startUrl); hls.attachMedia(v);
    } else if(v.canPlayType("application/vnd.apple.mpegurl")){
      v.src = startUrl; v.play().catch(()=>show("Tap / click to play"));
    } else { show("HLS not supported here"); }
  }

  async function run(){
    await pickEnglishAudio();
    // Step 1: MDE decision — and read what Plex actually chose (direct vs transcode)
    let dec = null;
    try{
      const ctl = new AbortController();
      const timer = setTimeout(()=>ctl.abort(), 12000);
      let r;
      try{ r = await fetch(decisionUrl, { cache:"no-store", signal:ctl.signal, headers:{ Accept:"application/json" } }); }
      finally{ clearTimeout(timer); }
      if(!r.ok){ show("Decision refused:\nHTTP "+r.status+" "+r.statusText+"\n"+(await safeText(r))); return; }
      try{ dec = await r.json(); }catch(_){ dec = null; }
    }catch(e){
      const em = (e && e.name==="AbortError") ? "timed out (server unreachable / wrong URL / mixed content)" : (e && e.message ? e.message : e);
      show("Decision unreachable:\n"+em); return;
    }
    // Step 2: video is stream-copied + audio transcoded to AAC, delivered as HLS.
    // hls.js feeds same-origin blobs so firefly can read the pixels (no taint).
    hide();
    play();
  }

  if(window.Hls){ run(); }
  else {
    let waited=0;
    const iv=setInterval(()=>{
      if(window.Hls){ clearInterval(iv); run(); }
      else if((waited+=200)>6000){ clearInterval(iv); show("hls.js failed to load (no internet / CDN blocked)"); }
    },200);
  }
})();
</script>
</body>
</html>
